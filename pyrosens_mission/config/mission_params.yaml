mission_manager:
  ros__parameters:

    # --- Core mission proxy setup ---
    # This tells your Mission node which downstream Nav2 action to forward to.
    # The launch file already sets this default (so this is redundant but explicit).
    downstream_nav_action_name: "/nav2_downstream/navigate_to_pose"
    # Action name exposed to clients (RViz, teammates)
    upstream_nav_action_name: "/nav2/navigate_to_pose"

    # --- Topic-based goal intake (optional) ---
    # If your team ever wants to feed multiple goals at once (PoseArray or Path).
    # Leave false if your teammate uses NavigateToPose (action client).
    goals_topic: "/mission/load_goals"
    allow_path_input: false
    path_topic: "/goals/path"

    # --- Streaming input (optional) ---
    # If you want to stream PoseStamped goals and then commit them later.
    allow_pose_stream: false
    pose_stream_topic: "/goals/pose_stream"

    # --- Optional debugging/verbosity parameters ---
    # You can add these if you implement logs or safety hooks later.
    # e.g. log_level: "info"
