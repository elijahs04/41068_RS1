mission_manager:
  ros__parameters:

    # --- Core mission proxy setup ---
    downstream_nav_action_name: "/navigate_to_pose"
    # Action name exposed to clients of the mission manager
    upstream_nav_action_name: "/mission/navigate_to_pose"
    # Timeout for waiting for downstream navigation action server
    downstream_wait_timeout_sec: 15.0

    # --- Home position used when aborting a mission ---
    home_frame_id: "map"
    home_x: 0.0
    home_y: 0.0
    home_z: 0.0
    home_yaw_deg: 0.0

    goals_topic: "/mission/load_goals"
    allow_path_input: false
    path_topic: "/goals/path"

    allow_pose_stream: false
    pose_stream_topic: "/goals/pose_stream"